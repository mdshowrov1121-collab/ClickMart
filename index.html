<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClickMart</title>

<!-- Supabase CDN -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:Arial,sans-serif;
  background:#f5f6f8;
  color:#222;
}
header{
  background:white;
  padding:18px 5%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 2px 10px #00000012;
}
.logo{
  font-size:28px;
  font-weight:800;
  color:#ff4d00;
}
.header-right {
  display: flex;
  gap: 12px;
  align-items: center;
}
.cart{
  background:#ff4d00;
  color:white;
  padding:10px 16px;
  border-radius:25px;
  border:0;
  cursor:pointer;
}
.searchbox{
  padding:30px 5%;
  background:white;
  display:flex;
  gap:10px;
}
.searchbox input{
  flex:1;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}
.searchbox button{
  padding:15px 25px;
  border:0;
  border-radius:10px;
  background:#ff4d00;
  color:white;
  cursor:pointer;
}
.hero{
  margin:35px 5%;
  padding:60px 7%;
  border-radius:25px;
  background:linear-gradient(135deg,#ff4d00,#ff8a00);
  color:white;
}
.hero h1{font-size:42px;margin-bottom:15px}
.hero p{font-size:18px;margin-bottom:25px}
.hero button{
  padding:14px 25px;
  border:0;
  border-radius:10px;
  background:white;
  color:#ff4d00;
  font-weight:bold;
  cursor:pointer;
}
section{padding:20px 5%}
h2{margin-bottom:20px}
.categories{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(130px,1fr));
  gap:15px;
}
.category{
  background:white;
  padding:25px 10px;
  text-align:center;
  border-radius:15px;
  cursor:pointer;
  box-shadow:0 3px 12px #0000000d;
}
.products{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}
.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 3px 15px #00000012;
}
.product img{
  width:100%;
  height:220px;
  object-fit:cover;
  background:#eee;
}
.product-info{padding:18px}
.product h3{margin-bottom:10px}
.price{
  color:#ff4d00;
  font-size:22px;
  font-weight:bold;
}
.old{
  color:#999;
  text-decoration:line-through;
  font-size:14px;
  margin-left:8px;
}
.add{
  width:100%;
  margin-top:15px;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#ff4d00;
  color:white;
  cursor:pointer;
}
footer{
  margin-top:50px;
  background:#222;
  color:white;
  text-align:center;
  padding:35px;
}

/* MODALS & OVERLAYS FOR SINGLE PAGE */
.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.5);
  z-index: 100;
  justify-content: center;
  align-items: center;
  overflow: auto;
  padding: 20px;
}
.auth-card, .admin-card-box {
  background: white;
  padding: 30px;
  border-radius: 20px;
  width: 100%;
  max-width: 450px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.2);
}
.admin-container {
  display: none;
  padding: 30px 5%;
}
.card{
  background:white;
  padding:20px;
  border-radius:15px;
  margin-bottom:20px;
  box-shadow: 0 3px 10px rgba(0,0,0,0.08);
}
.card input,.card textarea{
  width:100%;
  padding:12px;
  margin:8px 0 15px 0;
  border:1px solid #ddd;
  border-radius:8px;
}
.btn{
  padding:11px 18px;
  border:0;
  border-radius:8px;
  background:#ff4d00;
  color:white;
  cursor:pointer;
  margin-top:8px;
}
.product-row{
  border:1px solid #ddd;
  padding:15px;
  border-radius:10px;
  margin-top:10px;
  display: flex;
  justify-content:space-between;
  align-items:center;
}
@media(max-width:600px){
  .hero h1{font-size:30px}
  .hero{padding:40px 25px}
}
</style>
</head>

<body>

<!-- MAIN WEBSITE VIEW -->
<div id="mainWebsite">
  <header>
    <div class="logo">🛒 ClickMart</div>
    <div class="header-right">
      <button class="btn" style="margin-top:0; background:#333;" onclick="openLoginModal()">Login / Admin</button>
      <button class="cart" onclick="showCart()">🛍️ Cart <span id="cartCount">0</span></button>
    </div>
  </header>

  <div class="searchbox">
    <input id="search" placeholder="Search products..." oninput="renderProducts()">
    <button onclick="renderProducts()">Search</button>
  </div>

  <div class="hero">
    <h1 id="heroTitle">Big Shopping Sale!</h1>
    <p id="heroText">Discover amazing products at amazing prices.</p>
    <button onclick="document.getElementById('products').scrollIntoView()">Shop Now →</button>
  </div>

  <section>
    <h2>Shop By Category</h2>
    <div class="categories" id="categories"></div>
  </section>

  <section id="products">
    <h2>Popular Products</h2>
    <div class="products" id="productList"></div>
  </section>

  <footer>
    <div class="logo">🛒 ClickMart</div>
    <p style="margin-top:10px">© 2026 ClickMart. All Rights Reserved.</p>
  </footer>
</div>

<!-- LOGIN / SIGNUP MODAL (একই পেজে পপআপ হিসেবে আসবে) -->
<div class="overlay" id="loginModal">
  <div class="auth-card">
    <h2 style="color:#ff4d00; text-align:center; margin-bottom:10px;">ClickMart Login</h2>
    <p style="text-align:center; color:#777; margin-bottom:20px;">Access your account or admin panel</p>
    
    <label style="font-weight:bold;">Email</label>
    <input type="email" id="authEmail" placeholder="Enter your email">
    
    <label style="font-weight:bold;">Password</label>
    <input type="password" id="authPassword" placeholder="Enter your password">
    
    <div style="display:flex; gap:10px;">
      <button class="btn" style="flex:1;" onclick="supabaseLogin()">Login</button>
      <button class="btn" style="flex:1; background:#333;" onclick="supabaseSignUp()">Sign Up</button>
    </div>

    <p id="authMessage" style="text-align:center; margin-top:15px; font-size:14px;"></p>

    <button class="btn" style="width:100%; background:#777; margin-top:15px;" onclick="closeLoginModal()">Close</button>
  </div>
</div>

<!-- ADMIN DASHBOARD (লগইন সফল হলে হোমপেজ লুকিয়ে এটি দেখাবে) -->
<div class="admin-container" id="adminDashboard">
  <div style="display:flex; justify-content:space-between; align-items:center; background:#222; color:white; padding:15px 25px; border-radius:10px; margin-bottom:25px;">
    <h2>⚙️ ClickMart Admin Dashboard</h2>
    <button class="btn" style="margin-top:0; background:#d9534f;" onclick="logoutAdmin()">Logout</button>
  </div>

  <div class="card">
    <h2>Store Settings</h2>
    <label>Store Name</label>
    <input id="storeName" value="ClickMart">
    <label>Hero Title</label>
    <input id="adminHeroTitle" value="Big Shopping Sale!">
    <label>Hero Description</label>
    <textarea id="adminHeroText">Discover amazing products at amazing prices.</textarea>
    <button class="btn" onclick="saveSettings()">Save Settings</button>
  </div>

  <div class="card">
    <h2>Add Product</h2>
    <input id="pName" placeholder="Product name">
    <input id="pPrice" type="number" placeholder="Price">
    <input id="pOldPrice" type="number" placeholder="Old price">
    <input id="pCategory" placeholder="Category">
    <input id="pImage" placeholder="Image URL">
    <button class="btn" onclick="addProduct()">Add Product</button>
  </div>

  <div class="card">
    <h2>Manage Products</h2>
    <div id="adminProducts"></div>
  </div>
</div>

<script>
/* SUPABASE CONFIG */
const SUPABASE_URL = "https://xmgvszxmofbyzejcxlku.supabase.co";
const SUPABASE_KEY = "sb_publishable_c8vQsp8cKDjkWjRLCpvoNQ_qoOUvYAB";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let products = [
 { id:1, name:"Smartphone Pro", price:18999, oldPrice:23999, category:"Electronics", image:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?w=600" },
 { id:2, name:"Wireless Headphone", price:1499, oldPrice:1799, category:"Electronics", image:"https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=600" },
 { id:3, name:"Smart Watch", price:2099, oldPrice:2999, category:"Watches", image:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600" },
 { id:4, name:"Premium Sneakers", price:1899, oldPrice:2499, category:"Fashion", image:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" }
];

let cart = [];
let categories = ["📱 Electronics", "👕 Fashion", "🏠 Home", "💄 Beauty", "🎮 Gaming", "⌚ Watches"];

function renderCategories(){
 const box=document.getElementById("categories");
 box.innerHTML=categories.map(c=>`
   <div class="category" onclick="filterCategory('${c.replace(/^[^ ]+ /,'')}')">
      <div style="font-size:35px">${c.split(" ")[0]}</div>
      <div style="margin-top:10px">${c.substring(c.indexOf(" ")+1)}</div>
   </div>
 `).join("");
}

function renderProducts(){
 const box=document.getElementById("productList");
 const search=document.getElementById("search").value.toLowerCase();
 const filtered=products.filter(p => p.name.toLowerCase().includes(search) || p.category.toLowerCase().includes(search));

 box.innerHTML=filtered.map(p=>`
   <div class="product">
      <img src="${p.image}" alt="${p.name}">
      <div class="product-info">
        <h3>${p.name}</h3>
        <div style="color:#f5a000;margin-bottom:10px">★★★★★</div>
        <span class="price">৳${Number(p.price).toLocaleString()}</span>
        <span class="old">৳${Number(p.oldPrice).toLocaleString()}</span>
        <button class="add" onclick="addToCart(${p.id})">Add to Cart</button>
      </div>
   </div>
 `).join("");
}

function filterCategory(category){
 document.getElementById("search").value=category;
 renderProducts();
}

function addToCart(id){
 const product=products.find(p=>p.id===id);
 cart.push(product);
 document.getElementById("cartCount").innerText=cart.length;
 alert(product.name+" added to cart!");
}

function showCart(){
 if(cart.length===0){ alert("Your cart is empty."); return; }
 let total=cart.reduce((sum,p)=>sum+Number(p.price),0);
 alert("Cart Items: "+cart.length+"\nTotal: ৳"+total.toLocaleString());
}

/* MODAL CONTROLS */
function openLoginModal(){ document.getElementById("loginModal").style.display="flex"; }
function closeLoginModal(){ document.getElementById("loginModal").style.display="none"; }

/* SUPABASE AUTHENTICATION */
async function supabaseLogin(){
 const email = document.getElementById("authEmail").value.trim();
 const password = document.getElementById("authPassword").value;
 const msg = document.getElementById("authMessage");

 if(!email || !password){ msg.style.color="red"; msg.innerText="Fill in email and password"; return; }

 const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
 if(error){ msg.style.color="red"; msg.innerText=error.message; return; }

 msg.style.color="green";
 msg.innerText="Login successful!";
 
 setTimeout(() => {
   closeLoginModal();
   checkAdmin(data.user.id);
 }, 800);
}

async function supabaseSignUp(){
 const email = document.getElementById("authEmail").value.trim();
 const password = document.getElementById("authPassword").value;
 const msg = document.getElementById("authMessage");

 if(!email || !password){ msg.style.color="red"; msg.innerText="Fill in email and password"; return; }

 const { data, error } = await supabaseClient.auth.signUp({ email, password });
 if(error){ msg.style.color="red"; msg.innerText=error.message; return; }

 msg.style.color="green";
 msg.innerText="Sign up successful! Check your email.";
}

async function checkAdmin(userId){
 const { data, error } = await supabaseClient.from('admins').select('*').eq('user_id', userId).maybeSingle();
 if(error || !data){
   alert("Logged in successfully, but you are not an admin!");
   return;
 }
 // Switch view to Admin Dashboard
 document.getElementById("mainWebsite").style.display="none";
 document.getElementById("adminDashboard").style.display="block";
 renderAdminProducts();
}

async function logoutAdmin(){
 await supabaseClient.auth.signOut();
 document.getElementById("adminDashboard").style.display="none";
 document.getElementById("mainWebsite").style.display="block";
 alert("Logged out successfully!");
}

function renderAdminProducts(){
 const box=document.getElementById("adminProducts");
 box.innerHTML=products.map(p=>`
   <div class="product-row">
     <div>
       <strong>${p.name}</strong>
       <p style="color:#777; font-size:14px;">Price: ৳${p.price} | Category: ${p.category}</p>
     </div>
     <button class="btn" style="margin-top:0; background:#d9534f;" onclick="deleteProduct(${p.id})">Delete</button>
   </div>
 `).join("");
}

function addProduct(){
 const name=document.getElementById("pName").value;
 const price=document.getElementById("pPrice").value;
 const oldPrice=document.getElementById("pOldPrice").value;
 const category=document.getElementById("pCategory").value;
 const image=document.getElementById("pImage").value;

 if(!name || !price){ alert("Product name and price are required."); return; }

 products.push({
   id:Date.now(),
   name:name,
   price:Number(price),
   oldPrice:Number(oldPrice || price),
   category:category || "General",
   image:image || "https://via.placeholder.com/600"
 });

 document.getElementById("pName").value="";
 document.getElementById("pPrice").value="";
 document.getElementById("pOldPrice").value="";
 document.getElementById("pCategory").value="";
 document.getElementById("pImage").value="";

 renderProducts();
 renderAdminProducts();
 alert("Product added successfully!");
}

function deleteProduct(id){
 if(!confirm("Delete this product?")) return;
 products=products.filter(p=>p.id!==id);
 renderProducts();
 renderAdminProducts();
}

function saveSettings(){
 const title=document.getElementById("adminHeroTitle").value;
 const text=document.getElementById("adminHeroText").value;
 document.getElementById("heroTitle").innerText=title;
 document.getElementById("heroText").innerText=text;
 alert("Settings saved!");
}

renderCategories();
renderProducts();
</script>

</body>
</html>
